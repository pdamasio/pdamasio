<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

.lista {
    position: absolute;
    width: 100%;
    animation: subir 15s linear infinite;
}

.item {
    font-family: Arial, sans-serif;
    font-size: 32px;
    color: white;
    text-shadow:
        2px 2px 4px black,
        -1px -1px 2px black;
    margin: 25px 0;
    text-align: center;
}

@keyframes subir {
    from {
        transform: translateY(100vh);
    }
    to {
        transform: translateY(-100%);
    }
}
</style>
</head>

<body>

<div class="lista">

    <div class="item">★ Os 12 Signos de Valentina</div>
    <div class="item">★ Um novo vídeo em breve</div>
    <div class="item">★ Obrigada por assistir!</div>
    <div class="item">★ Não esqueça de se inscrever</div>

</div>

</body>
</html>
