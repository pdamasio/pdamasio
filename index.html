<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent !important;
}


/* PAINEL FIXO */

.painel {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background-color: rgba(30, 30, 30, 0.90) !important;

    box-sizing: border-box;
}


/* ÁREA QUE SE MOVIMENTA */

.rolagem {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;

    animation: subir 25s linear infinite;
}


/* CONTEÚDO */

.resenha {
    width: 100%;
    margin: 0;
    padding: 45px 35px;

    box-sizing: border-box;

    font-family: Arial, sans-serif;

    color: white;

    text-align: left;
}


/* TÍTULO */

.titulo {
    font-size: 60px !important;
    font-weight: bold;

    margin-bottom: 35px;
}


/* NOME DO LIVRO */

.livro {
    font-size: 42px !important;

    margin-bottom: 25px;
}


/* ESTRELAS */

.estrelas {
    font-size: 40px !important;

    margin-bottom: 30px;

    letter-spacing: 4px;
}


/* COMENTÁRIO */

.comentario {
    font-size: 32px !important;

    line-height: 1.5;
}


/* ROLAGEM */

@keyframes subir {

    from {
        transform: translateY(100%);
    }

    to {
        transform: translateY(-100%);
    }

}

</style>

</head>


<body>

<div
    class="painel"
    style="
        background-color: rgba(30, 30, 30, 0.90);
        width: 100%;
        height: 100%;
    "
>

    <div class="rolagem">

        <div class="resenha">

            <div class="titulo">
                LIDOS EM 2026
            </div>

            <div class="livro">
                – Os 12 Signos de Valentina
            </div>

            <div class="estrelas">
                ⭐⭐⭐⭐⭐
            </div>

            <div class="comentario">
                Foi muito agradável. Ri bastante e esperava um final
                xpto, mas tive uma agradável surpresa que me fez terminar
                com uma grande gargalhada.
            </div>

        </div>

    </div>

</div>

</body>

</html>
