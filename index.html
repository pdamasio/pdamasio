<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<style>

/* ===== PÁGINA TRANSPARENTE ===== */

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent !important;
}


/* ===== QUADRADO CINZA FIXO ===== */

.painel {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: rgba(20, 20, 20, 0.85);

    border-radius: 15px;

    box-sizing: border-box;
}


/* ===== TEXTO QUE ROLA ===== */

.rolagem {
    position: absolute;

    width: 100%;

    animation: subir 20s linear infinite;
}


/* ===== CONTEÚDO ===== */

.resenha {
    width: 100%;

    margin: 0;

    padding: 40px 30px;

    box-sizing: border-box;

    font-family: Arial, sans-serif;

    color: white;

    text-align: left;

    text-shadow:
        2px 2px 4px rgba(0,0,0,0.9),
        -1px -1px 2px rgba(0,0,0,0.8);
}


.titulo {
    font-size: 36px;
    font-weight: bold;
    margin-bottom: 25px;
}


.livro {
    font-size: 30px;
    margin-bottom: 20px;
}


.estrelas {
    font-size: 32px;
    margin-bottom: 25px;
    letter-spacing: 3px;
}


.comentario {
    font-size: 26px;
    line-height: 1.45;
}


/* ===== ANIMAÇÃO ===== */

@keyframes subir {

    from {
        transform: translateY(100%);
    }

    to {
        transform: translateY(-100%);
    }

}

</style>
</head>


<body>

<div class="painel">

    <div class="rolagem">

        <div class="resenha">

            <div class="titulo">
                Lidos em 2026
            </div>

            <div class="livro">
                – Os 12 Signos de Valentina
            </div>

            <div class="estrelas">
                ⭐⭐⭐⭐⭐
            </div>

            <div class="comentario">
                Foi muito agradável. Ri bastante e esperava um final
                xpto, mas tive uma agradável surpresa que me fez terminar
                com uma grande gargalhada.
            </div>

        </div>

    </div>

</div>

</body>

</html>
